<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PhishGuard</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8.5 12.2l2.4 2.4 4.6-4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <h1>PhishGuard</h1>
      <p>On-device scam &amp; phishing protection</p>
    </div>
  </div>
  <label class="switch" title="Turn protection on or off">
    <input type="checkbox" id="toggle" checked>
    <span class="slider"></span>
  </label>
</header>

<section id="page-card" class="card">
  <h2>This page</h2>
  <div id="page-verdict" class="verdict-row">
    <svg class="dial" viewBox="0 0 120 70">
      <path d="M10 62 A 52 52 0 0 1 110 62" fill="none" stroke="#2c2c2a" stroke-width="9" stroke-linecap="round"/>
      <path id="dial-arc" d="M10 62 A 52 52 0 0 1 110 62" fill="none" stroke="#0ca30c" stroke-width="9" stroke-linecap="round"/>
      <text id="dial-num" x="60" y="56" text-anchor="middle">–</text>
      <text x="60" y="68" text-anchor="middle" class="dial-cap">risk / 100</text>
    </svg>
    <div class="verdict-text">
      <strong id="page-label">Checking…</strong>
      <span id="page-host" class="mono"></span>
    </div>
  </div>
  <ul id="page-reasons" class="reasons"></ul>
  <button id="scan-page" class="ghost-btn">Scan this page's text for scams</button>
</section>

<nav class="tabs">
  <button id="tab-link" class="active">Link</button>
  <button id="tab-msg">Message</button>
  <button id="tab-qr">QR code</button>
</nav>

<section id="pane-link" class="card pane">
  <textarea id="link-input" rows="2" class="mono" spellcheck="false"
    placeholder="Paste any link to check it before you click"></textarea>
  <button id="scan-link" class="primary">Scan link</button>
</section>

<section id="pane-msg" class="card pane" hidden>
  <textarea id="msg-body" rows="5"
    placeholder="Paste any suspicious SMS, WhatsApp message, or email here"></textarea>
  <input id="msg-sender" type="text" class="mono" placeholder="Sender (optional — number or email)">
  <button id="scan-msg" class="primary">Analyze message</button>
</section>

<section id="pane-qr" class="card pane" hidden>
  <label for="qr-file" class="drop">
    <strong>Check a QR before you pay</strong>
    <span>Tap to choose a photo or screenshot of the QR code.
      Decoded and checked on your device — never uploaded.</span>
  </label>
  <input id="qr-file" type="file" accept="image/*" hidden>
  <canvas id="qr-canvas" hidden></canvas>
</section>

<section id="scan-result" class="card" hidden>
  <div class="verdict-row compact">
    <span id="result-icon" class="icon"></span>
    <div class="verdict-text">
      <strong id="result-label"></strong>
      <span id="result-score"></span>
    </div>
  </div>
  <p id="result-detail" class="detail" hidden></p>
  <ul id="result-reasons" class="reasons"></ul>
  <div id="advice" class="advice" hidden>
    <h3>What you should do</h3>
    <ul id="advice-list"></ul>
  </div>
</section>

<footer>
  <div class="stats">
    <span><b id="s-scans">0</b> scanned</span>
    <span class="crit"><b id="s-phish">0</b> phishing</span>
    <span class="warn"><b id="s-susp">0</b> suspicious</span>
  </div>
  <p class="privacy">100% offline — links, messages and QR photos never leave this browser.</p>
</footer>

<script src="../lib/jsQR.js"></script>
<script src="popup.js" type="module"></script>
</body>
</html>
